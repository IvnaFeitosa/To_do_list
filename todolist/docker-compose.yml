version: '3.9'

services:
  db:
    image: postgres:latest
    environment:
      SECRET_KEY_BASE: --/e/bohT+NEDGl1JW--Em6Xy0Pw8P2yRp+o2Qw4DA==
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    environment:
      SECRET_KEY_BASE: --/e/bohT+NEDGl1JW--Em6Xy0Pw8P2yRp+o2Qw4DA==
    build: .
    command: ./bin/thrust ./bin/rails server
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db-data:
